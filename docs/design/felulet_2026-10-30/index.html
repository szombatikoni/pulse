<title>PULSE felületterv</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{--bg:#1a1816;color-scheme:dark}body{background:var(--bg)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..700&family=Inter:opsz,wght@14..32,400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Manrope:wght@400..800&family=Geist:wght@400..700&family=Literata:opsz,wght@7..72,400..700&family=Atkinson+Hyperlegible+Next:wght@400..700&display=swap">
