server {
    listen 80;
    root /usr/share/nginx/html;

    # A Docker belső névfeloldója. Az nginx alapból csak induláskor kérdezi le
    # az "api" nevű konténer címét; ha a backend újraépül (új IP-t kap), a
    # régire küldené a kéréseket (502). A változóba tett cím miatt kérésenként,
    # legfeljebb 10 másodpercig gyorsítótárazva oldja fel újra.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Az /api kéréseket a backend konténer kapja (a compose-ban a neve: api).
    # Így a böngésző egyetlen címet lát, és nem kell CORS-beállítás. A változós
    # proxy_pass (URI nélkül) az eredeti útvonalat változatlanul továbbítja.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Egyoldalas alkalmazás: minden ismeretlen útvonal az index.html-t kapja,
    # az útvonalat a böngészőben a React Router kezeli.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
