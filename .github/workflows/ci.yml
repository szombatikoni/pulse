# Folyamatos integráció (CI) a GitHub saját gépein. Ha bármelyik lépés hibát
# ad, a commit vagy a pull request mellett piros X jelenik meg.
#
# Ágmodell: a napi munka a develop ágon folyik, a main csak pull requesttel
# kap változást (mérföldkövenként, tagekkel: m2, m3, ...).
#   - push a developra: azonnali visszajelzés munka közben;
#   - pull request a mainre: piros CI mellett nem szabad összefésülni
#     (ezt a GitHub ágvédelmi beállítása kényszeríti ki);
#   - push a mainre (a merge után): a zöld pipa a stabil állapotot igazolja.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, migrációk, pytest)
    runs-on: ubuntu-latest
    # A tesztekhez valódi PostgreSQL kell (ugyanaz a verzió, mint a compose-ban).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@127.0.0.1:5432/pulse_test
      TEST_DATABASE_URL: postgresql+psycopg://pulse:pulse@127.0.0.1:5432/pulse_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Függőségek a uv.lock szerint
        run: uv sync --locked
      - name: Kódellenőrzés (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: A migrációk lefutnak, és egyeznek a modellekkel
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tesztek, legalább 70% lefedettséggel
        run: uv run pytest --cov=app --cov=seed --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend (lint, formázás, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Típusellenőrzés és build
        run: npm run build

  cql:
    name: CQL-szolgáltatás (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Ugyanaz a főverzió, mint a szolgáltatás image-ében (node:24.21.0-alpine3.24).
          node-version: "24"
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - run: npm ci
      - name: A szolgáltatás tesztjei (HTTP-felület, kiértékelés a kézi csomagon)
        run: npm run teszt

  docker:
    name: Docker-image-ek és böngészős teszt
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      # A worker kézbesítő köre itt 5 másodpercenként fut (alapból 30), hogy az
      # e-mail-lépés ne várjon sokat; a compose ebből a változóból olvassa.
      DELIVERY_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v7
      # Ugyanaz az indítás, mint a README-ben: tiszta adatbázis, majd a demóadat.
      - name: Az image-ek építése és a rendszer indítása
        run: docker compose up --build -d --wait
      - name: Mesterséges demóadat (seed)
        run: docker compose exec -T api python -m seed
      # A pytest a CQL-szolgáltatást hamis klienssel helyettesíti; itt a teljes
      # lánc fut a valódi konténerekkel (DB → FHIR-csomag → CQL-motor →
      # összevetés), egy seedelt betegen, kézzel számolt elvárással.
      - name: NICE-kiértékelés a valódi CQL-motorral (teljes lánc)
        run: docker compose exec -T api python -m scripts.nice_lanc_proba
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Playwright és a Chromium telepítése
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Böngészős folyamatteszt (a két M2-folyamat a felületen)
        working-directory: e2e
        run: npx playwright test
      # Az e-mail-értesítés (M3, A9) a valódi konténerekkel: a böngészős teszt
      # kérdőív-folyamatában Tóth Mária kritikus (13 pontos) kitöltése új, súlyos
      # riasztást nyit. A seedben nincs kitöltése, így ez nem ismételt
      # aktiválódás, és nem a seedből jön. A worker a levelet a Mailpitnek küldi
      # Nagy doktornak (Tóth Mária orvosa); a lépés a Mailpit API-ján legfeljebb
      # 90 másodpercig várja, majd ellenőrzi, hogy a levélben nincs betegnév, és
      # a Riasztások oldalra mutat.
      - name: E-mail-értesítés a Mailpitben (új riasztás után)
        run: |
          for i in $(seq 1 30); do
            id=$(curl -fsS http://127.0.0.1:8025/api/v1/messages | jq -r '[.messages[]
              | select(.Subject == "PULSE: új riasztás (Súlyos)")
              | select(any(.To[]; .Address == "dr.nagy@pulse.example"))][0].ID // empty' || true)
            if [ -n "$id" ]; then
              text=$(curl -fsS "http://127.0.0.1:8025/api/v1/message/$id" | jq -r .Text)
              echo "$text"
              if ! echo "$text" | grep -q "/doctor/alerts"; then
                echo "A levélből hiányzik a Riasztások oldal címe."
                exit 1
              fi
              if echo "$text" | grep -q "Tóth"; then
                echo "A levél betegnevet tartalmaz."
                exit 1
              fi
              exit 0
            fi
            sleep 3
          done
          echo "Nem érkezett meg a levél a Mailpitbe."
          curl -fsS http://127.0.0.1:8025/api/v1/messages | jq .
          exit 1
      - name: Hiba esetén a képernyőképek és a nyomkövetés feltöltése
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-eredmeny
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
      - name: Hiba esetén a konténerek naplója
        if: failure()
        run: docker compose logs --no-color
